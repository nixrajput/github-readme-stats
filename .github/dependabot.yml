# Dependabot keeps dependencies and workflow action pins current. Weekly rather
# than daily so a quiet repo does not generate noise, and grouped so one PR covers
# a batch instead of one PR per package.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
