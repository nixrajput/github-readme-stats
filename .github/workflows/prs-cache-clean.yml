name: PR cache cleanup

# Frees Actions cache storage when a PR closes.
on:
  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cleanup
        run: |
          echo "Fetching list of cache ids"
          cacheIdsForPR=$(gh cache list --ref "$BRANCH" --limit 100 --json id --jq '.[].id')

          ## Setting this to not fail the workflow while deleting cache keys. 
          set +e
          echo "Deleting caches..."
          for cacheId in $cacheIdsForPR
          do
              gh cache delete "$cacheId"
          done
          echo "Done"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: refs/pull/${{ github.event.pull_request.number }}/merge
